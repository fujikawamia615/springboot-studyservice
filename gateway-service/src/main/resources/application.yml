spring:
  application:
    name: gateway-service
  config:
    import: optional:file:${user.home}/studysys.env[.properties]
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: ${NACOS_PASSWORD}
        ip: 127.0.0.1

server:
  port: 9095

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000